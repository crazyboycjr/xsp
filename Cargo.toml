[package]
name = "xsp"
version = "0.1.0"
edition = "2021"
description = "xmonad's exclusive scratchpads for Alacritty on macOS"
publish = false

[dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "block2", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSNotification",
    "NSObject", "NSOperation", "NSString", "NSURL", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "libc", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
